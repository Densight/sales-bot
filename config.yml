# ── SALES INTELLIGENCE BOT — CONFIGURATION ───────────────────────────────────
# Edit this file to personalise the bot for your company.
# No code changes needed — just update the values below and push.

company:
  name: "Densight Labs"
  service: "AI implementation and workflow automation for enterprise teams"
  target_market: "US-based mid-market companies scaling their operations or tech teams"

# What kind of trigger signals to look for
# Examples: "hiring", "funding", "launched", "series a", "raised"
signals:
  keywords:
    - "hiring"
    - "launched"
    - "show hn"
    - "raised"
    - "series a"
    - "series b"
    - "funding"

# How many companies to identify per run (max 5 recommended)
output:
  companies: 3

